services:
  # ── Web API (HTTP only, NO monitor thread) ──────────────────
  - type: web
    name: secure-payment-api
    env: python
    region: oregon
    branch: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RUN_MONITOR
        value: "0"
      - key: FRONTEND_URL
        value: "https://zyphra.in"
      - key: RPC_URL
        sync: false
      - key: ADMIN_PRIVATE_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FEE_WALLET
        sync: false
      - key: EXPECTED_CHAIN_ID
        sync: false
      - key: FEE_PERCENTAGE
        value: "1"
      - key: VERIFICATION_CONFIRMATIONS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: payment-db
          property: connectionString

  # ── Background Worker (runs monitor loop 24/7) ──────────────
  - type: worker
    name: transaction-monitor
    env: python
    region: oregon
    branch: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RPC_URL
        sync: false
      - key: ADMIN_PRIVATE_KEY
        sync: false
      - key: FEE_WALLET
        sync: false
      - key: EXPECTED_CHAIN_ID
        sync: false
      - key: FEE_PERCENTAGE
        value: "1"
      - key: VERIFICATION_CONFIRMATIONS
        value: "3"
      - key: POLL_INTERVAL
        value: "15"
      - key: MAX_GAS_WAIT_RETRIES
        value: "10"
      - key: FORWARD_DEADLINE_SECONDS
        value: "3600"
      - key: DATABASE_URL
        fromDatabase:
          name: payment-db
          property: connectionString

# ── Free PostgreSQL (shared by both services) ────────────────
databases:
  - name: payment-db
    databaseName: payments
    user: payments_user
    plan: free
    region: oregon
