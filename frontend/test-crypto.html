<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaMask Chat E2EE - Cryptography Foundation Test Suite</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --primary: #f6851b; /* MetaMask Orange */
      --primary-hover: #e2761b;
      --success: #238636;
      --success-light: #2ea043;
      --danger: #da3633;
      --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .fox-logo {
      width: 44px;
      height: 44px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .status-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .status-badge.running {
      background-color: rgba(246, 133, 27, 0.15);
      color: var(--primary);
      border: 1px solid rgba(246, 133, 27, 0.4);
    }

    .status-badge.passed {
      background-color: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
    }

    .status-badge.failed {
      background-color: rgba(218, 54, 51, 0.15);
      color: #f85149;
      border: 1px solid rgba(218, 54, 51, 0.4);
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .test-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .test-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .test-item.passed {
      border-left: 4px solid var(--success-light);
    }

    .test-item.failed {
      border-left: 4px solid var(--danger);
    }

    .test-info {
      flex: 1;
    }

    .test-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .test-details {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      word-break: break-all;
    }

    .test-error {
      color: #f85149;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      font-family: var(--font-mono);
    }

    .test-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
      min-width: 80px;
    }

    .test-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .test-tag.pass {
      background-color: rgba(46, 160, 67, 0.2);
      color: #3fb950;
    }

    .test-tag.fail {
      background-color: rgba(218, 54, 51, 0.2);
      color: #f85149;
    }

    .test-duration {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(246, 133, 27, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <svg class="fox-logo" viewBox="0 0 318.6 318.6" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill="#E2761B" stroke="#E2761B" stroke-linecap="round" stroke-linejoin="round" d="M274.1 35.5l-99.5 73.9L194 65.8z"/>
          <path fill="#E4761B" stroke="#E4761B" stroke-linecap="round" stroke-linejoin="round" d="M44.4 35.5l143.1 74.6-18.6-44.3z"/>
          <path fill="#E4761B" stroke="#E4761B" stroke-linecap="round" stroke-linejoin="round" d="M238.3 206.8l-37.7 57.5 65.5 18 19.3-74.8z"/>
          <path fill="#E4761B" stroke="#E4761B" stroke-linecap="round" stroke-linejoin="round" d="M33.2 207.5l19.3 74.8 65.5-18-37.7-57.5z"/>
          <path fill="#D7C1B3" stroke="#D7C1B3" stroke-linecap="round" stroke-linejoin="round" d="M80.3 139.3l-19-27.4-43.2 12.8 30.7 44.5z"/>
          <path fill="#D7C1B3" stroke="#D7C1B3" stroke-linecap="round" stroke-linejoin="round" d="M238.3 139.3l31.5 29.9 30.7-44.5-43.2-12.8z"/>
          <path fill="#233447" stroke="#233447" stroke-linecap="round" stroke-linejoin="round" d="M106.6 247.3l33.8-33.2-46.7-18.4z"/>
          <path fill="#233447" stroke="#233447" stroke-linecap="round" stroke-linejoin="round" d="M178.2 214.1l33.8 33.2 12.9-51.6z"/>
          <path fill="#CD6116" stroke="#CD6116" stroke-linecap="round" stroke-linejoin="round" d="M140.4 214.1l-33.8 33.2 3.8 20.9 32.5-4.2z"/>
          <path fill="#CD6116" stroke="#CD6116" stroke-linecap="round" stroke-linejoin="round" d="M178.2 214.1l-2.5 49.9 32.5 4.2 3.8-20.9z"/>
          <path fill="#E4751F" stroke="#E4751F" stroke-linecap="round" stroke-linejoin="round" d="M142.9 264l-32.5 4.2 24.3 23.3 25-10.1z"/>
          <path fill="#E4751F" stroke="#E4751F" stroke-linecap="round" stroke-linejoin="round" d="M175.7 264l-16.8 17.4 25 10.1 24.3-23.3z"/>
          <path fill="#F6851B" stroke="#F6851B" stroke-linecap="round" stroke-linejoin="round" d="M80.3 139.3l13.5 26.6 46.6-18.4-41.1-35.6z"/>
          <path fill="#F6851B" stroke="#F6851B" stroke-linecap="round" stroke-linejoin="round" d="M238.3 139.3l-19-27.4-41.1 35.6 46.6 18.4z"/>
        </svg>
        <div>
          <h1>MetaMask Chat E2EE Foundation</h1>
          <div class="subtitle">Step 1 — Real Browser Web Crypto &amp; IndexedDB Test Suite</div>
        </div>
      </div>
      <button class="btn" id="btn-rerun">Rerun Tests</button>
    </header>

    <div class="status-card">
      <div>
        <div style="font-weight: 600; margin-bottom: 0.25rem;">Suite Status</div>
        <div id="suite-status-text" style="font-size: 0.875rem; color: var(--text-muted);">
          Initializing Web Crypto and IndexedDB test runner...
        </div>
      </div>
      <div id="status-badge" class="status-badge running">
        <div class="spinner"></div>
        <span>Running Tests...</span>
      </div>
    </div>

    <!-- Hidden element for automated scrapers / subagents -->
    <div id="crypto-test-results" data-status="running" style="display: none;"></div>

    <div class="test-list" id="test-list">
      <!-- Populated dynamically -->
    </div>
  </div>

  <script type="module">
    import { runAllBrowserCryptoTests } from '/src/tests/browserCryptoRunner.ts';

    async function execute() {
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('suite-status-text');
      const testList = document.getElementById('test-list');
      const resultsDiv = document.getElementById('crypto-test-results');

      badge.className = 'status-badge running';
      badge.innerHTML = '<div class="spinner"></div><span>Running Tests...</span>';
      statusText.textContent = 'Executing 11 browser-native cryptographic test specifications...';
      testList.innerHTML = '';
      resultsDiv.setAttribute('data-status', 'running');

      const results = await runAllBrowserCryptoTests();
      const allPassed = results.every(r => r.passed);
      const passedCount = results.filter(r => r.passed).length;
      const totalCount = results.length;

      // Expose to window for automated extraction
      window.__CRYPTO_TEST_RESULTS__ = {
        total: totalCount,
        passed: passedCount,
        failed: totalCount - passedCount,
        allPassed,
        results,
      };

      resultsDiv.setAttribute('data-status', allPassed ? 'passed' : 'failed');
      resultsDiv.setAttribute('data-passed-count', String(passedCount));
      resultsDiv.setAttribute('data-total-count', String(totalCount));
      resultsDiv.textContent = JSON.stringify(window.__CRYPTO_TEST_RESULTS__);

      if (allPassed) {
        badge.className = 'status-badge passed';
        badge.innerHTML = '<span>✓ All Tests Passed</span>';
        statusText.textContent = `${passedCount} of ${totalCount} tests passed cleanly in real browser environment`;
      } else {
        badge.className = 'status-badge failed';
        badge.innerHTML = `<span>✕ ${totalCount - passedCount} Failed</span>`;
        statusText.textContent = `${passedCount} of ${totalCount} tests passed. Issues detected.`;
      }

      for (const res of results) {
        const item = document.createElement('div');
        item.className = `test-item ${res.passed ? 'passed' : 'failed'}`;
        item.innerHTML = `
          <div class="test-info">
            <div class="test-title">${res.id}. ${res.name}</div>
            ${res.details ? `<div class="test-details">${res.details}</div>` : ''}
            ${res.error ? `<div class="test-error">Error: ${res.error}</div>` : ''}
          </div>
          <div class="test-meta">
            <span class="test-tag ${res.passed ? 'pass' : 'fail'}">${res.passed ? 'PASS' : 'FAIL'}</span>
            <span class="test-duration">${res.durationMs}ms</span>
          </div>
        `;
        testList.appendChild(item);
      }
    }

    document.getElementById('btn-rerun').addEventListener('click', execute);
    execute();
  </script>
</body>
</html>
