name: keepalive-render

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          set -e
          if [ -z "${{ secrets.RENDER_BACKEND_HEALTH_URL }}" ]; then
            echo "Missing secret RENDER_BACKEND_HEALTH_URL (e.g. https://YOUR.onrender.com/api/health)"
            exit 1
          fi
          curl -fsS --max-time 20 "${{ secrets.RENDER_BACKEND_HEALTH_URL }}" > /dev/null
